[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paribu-cineverse-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for Paribu Cineverse cinemas — now showing, coming soon, showtimes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
paribu-cineverse-mcp = "cineverse_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cineverse_mcp"]
